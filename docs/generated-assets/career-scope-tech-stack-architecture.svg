    </filter>
    <linearGradient id="engineFill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="dbFill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5fbff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="34" markerHeight="34" refX="17" refY="17" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M5,5 L29,17 L5,29 Z" fill="#182f55"/>
    </marker>
    <style>
