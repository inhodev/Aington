<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1460" viewBox="0 0 2048 1460" role="img" aria-labelledby="title desc">
  <title id="title">과연 Career Scope 기술스택 아키텍처</title>
  <desc id="desc">Next.js, React, TypeScript, Express, Gemini, Prisma, Neon Postgres, MongoDB, Python 데이터 파이프라인으로 구성된 서비스 아키텍처 다이어그램</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
