      .box { fill: #ffffff; stroke: #182f55; stroke-width: 5; }
      .engine { fill: #eef6ff; stroke: #1189dc; stroke-width: 7; }
      .dbBox { fill: #ffffff; stroke: #182f55; stroke-width: 5; }
      .titleText { fill: #202020; font-weight: 800; font-size: 60px; }
      .techText { fill: #111111; font-weight: 800; font-size: 48px; }
      .midText { fill: #111111; font-weight: 800; font-size: 43px; }
      .subText { fill: #111111; font-weight: 700; font-size: 37px; }
      .tinyText { fill: #333333; font-weight: 700; font-size: 29px; }
      .mutedText { fill: #606060; font-weight: 700; font-size: 30px; }
      .line { stroke: #182f55; stroke-width: 5; stroke-linecap: round; fill: none; }
      .thinLine { stroke: #182f55; stroke-width: 4; stroke-linecap: round; fill: none; }
